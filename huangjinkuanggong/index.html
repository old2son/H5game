<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>黄金矿工 · 测试首页</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: radial-gradient(circle at 50% 30%, #3a2a17 0%, #1a120b 70%);
        color: #f5e9d6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 24px;
      }
      .home {
        width: min(560px, 100%);
        text-align: center;
        background: rgba(0, 0, 0, 0.28);
        border: 1px solid rgba(255, 212, 71, 0.25);
        border-radius: 20px;
        padding: 40px 28px 34px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
      }
      .home h1 {
        font-size: 30px;
        letter-spacing: 2px;
        color: #ffd447;
        text-shadow: 0 2px 0 #7a5a16;
        margin-bottom: 6px;
      }
      .home .sub {
        color: #c9b48f;
        font-size: 14px;
        margin-bottom: 30px;
      }
      .entries {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 18px;
      }
      .entry {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 26px 16px;
        border-radius: 16px;
        text-decoration: none;
        color: #1a120b;
        font-weight: 700;
        transition: transform 0.15s ease, box-shadow 0.15s ease;
        border: none;
        cursor: pointer;
      }
      .entry:hover { transform: translateY(-3px); }
      .entry:active { transform: translateY(0); }
      .entry .icon {
        width: 64px;
        height: 64px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 32px;
        background: rgba(255, 255, 255, 0.85);
        box-shadow: inset 0 -4px 8px rgba(0, 0, 0, 0.18);
      }
      .entry .label { font-size: 18px; }
      .entry .desc { font-size: 12px; font-weight: 500; opacity: 0.8; }
      .entry.canvas { background: linear-gradient(180deg, #ffd447, #f0a91e); box-shadow: 0 10px 22px rgba(240, 169, 30, 0.4); }
      .entry.phaser { background: linear-gradient(180deg, #4cc9f0, #2a7de1); color: #fff; box-shadow: 0 10px 22px rgba(42, 125, 225, 0.4); }
      .entry.phaser .icon { background: rgba(255, 255, 255, 0.9); }
      .footer { margin-top: 28px; font-size: 12px; color: #8c7a5e; }
    </style>
  </head>
  <body>
    <main class="home">
      <h1>⛏️ 黄金矿工</h1>
      <p class="sub">测试首页 · 选择引擎版本进入游戏</p>
      <div class="entries">
        <a class="entry canvas" href="/canvas.html">
          <span class="icon">🎨</span>
          <span class="label">Canvas 版</span>
          <span class="desc">原生 Canvas 2D 实现</span>
        </a>
        <a class="entry phaser" href="/phaser.html">
          <span class="icon">🚀</span>
          <span class="label">Phaser 版</span>
          <span class="desc">Phaser 4 游戏引擎</span>
        </a>
      </div>
      <p class="footer">当前环境：Vue 3 + Vite 8 + TypeScript</p>
    </main>
  </body>
</html>
