<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>黄金矿工 · Phaser 版</title>
    <link rel="icon" href="data:," />

    <style>
      html, body { margin: 0; height: 100%; background: #1a120b; overflow: hidden; }
      #game-root {
        width: 100vw;
        max-width: 768px;
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* 初始隐藏画布：preload / 首帧布局未稳前完全不可见，
         待 create() 中 fitCamera 完成、首帧正确布局渲染后（POST_RENDER）再翻为可见，
         用 visibility 而非 opacity，避免淡入过程中布局再结算导致的「跳动」观感 */
      #game-root canvas {
        visibility: hidden;
      }
      /* 竖屏游戏：PC 与移动端统一为竖屏体验，无需横屏旋转提示 */
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <script type="module" src="/src/phaser/main.ts"></script>
  </body>
</html>
